[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Job-hunt ledger, application prep and skill-up roadmap CLI powered by Claude"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=1.0",
    "openai>=1.50",
    "pydantic>=2",
    "pypdf>=4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[tool.setuptools.packages.find]
include = ["jobhunt*"]

[tool.setuptools.package-data]
"jobhunt.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
